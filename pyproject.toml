[project]
name = "pdet-fetcher"
version = "0.5.5"
description = "Collect microdata from PDET (CAGED, RAIS)"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "pdet",
    "caged",
    "rais",
    "labor",
    "microdata",
    "brazil",
    "open-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.12.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.39",
    "quantilica-analytics>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/pdet-fetcher"
Repository = "https://github.com/Quantilica/pdet-fetcher"
Issues = "https://github.com/Quantilica/pdet-fetcher/issues"

[project.scripts]
pdet-fetcher = "pdet_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
pdet = "pdet_fetcher.plugin:app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12",
    # Só para os testes: tests/test_check.py e tests/test_caged_2020.py exercitam o
    # plugin Typer, que depende do host (quantilica-cli). Não são dependências do pacote.
    "quantilica-cli>=0.10.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pdet_fetcher/__init__.py" = ["E402"]
"src/pdet_fetcher/meta.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdet_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
